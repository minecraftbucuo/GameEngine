<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameEngine · 服务端调试面板</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 鉴权层：token 只存 sessionStorage，不进 URL -->
<div id="auth" class="auth hidden">
  <form id="auth-form" autocomplete="off">
    <h1>服务端调试面板</h1>
    <p>输入服务端启动日志里打印的 token</p>
    <input id="token-input" type="password" placeholder="token" spellcheck="false" autocomplete="off">
    <button type="submit">连接</button>
    <div id="auth-error" class="err"></div>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <header>
    <div class="brand">服务端调试面板</div>
    <div id="conn" class="conn">未连接</div>
    <div class="spacer"></div>
    <div id="meta" class="meta"></div>
    <button id="btn-pause" class="ghost">暂停</button>
    <button id="btn-logout" class="ghost">退出</button>
  </header>

  <section id="cards" class="cards"></section>

  <section class="toolbar">
    <nav class="tabs">
      <button id="tab-map" class="tab active" data-view="map">地图</button>
      <button id="tab-table" class="tab" data-view="table">表格</button>
    </nav>

    <!-- 地图工具条 -->
    <div id="map-toolbar" class="map-toolbar">
      <label class="check"><input id="ov-velocity" type="checkbox" checked> 速度</label>
      <label class="check"><input id="ov-boxes" type="checkbox" checked> 碰撞盒</label>
      <label class="check"><input id="ov-grid" type="checkbox" checked> 网格</label>
      <label class="check"><input id="ov-centers" type="checkbox"> 中心点</label>
      <button id="btn-fit" class="ghost">适应视野</button>
      <button id="btn-fit-all" class="ghost">全览</button>
      <span id="follow-hint" class="muted"></span>
    </div>
  </section>

  <!-- 地图视图 -->
  <section id="view-map" class="view">
    <canvas id="map-canvas"></canvas>
    <div id="map-tooltip" class="map-tooltip hidden"></div>
    <div class="map-hint">滚轮缩放 · 拖动平移 · 点击对象跟随 · 黄闪=卡住 洋红=NaN 橙虚线=未start</div>
  </section>

  <!-- 表格视图：对象 / 客户端 两个子页 -->
  <section id="view-table" class="view hidden">
    <div class="subtabs">
      <button id="subtab-objects" class="tab active" data-sub="objects">对象</button>
      <button id="subtab-clients" class="tab" data-sub="clients">客户端</button>
    </div>

    <!-- 对象子页 -->
    <div id="sub-objects" class="sub-view">
      <div class="filter-row">
        <span class="filter-label">筛选</span>
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="moving" title="|vx| 或 |vy| &gt; 1">移动中</button>
        <button class="filter-btn" data-filter="stuck" title="有速度但位置不动">卡住</button>
        <button class="filter-btn" data-filter="abnormal" title="NaN / 未start / 已销毁 / inactive">异常</button>
        <button class="filter-btn" data-filter="enemy" title="Goomba / Koopa / Bowser">敌人</button>
        <button class="filter-btn" data-filter="mario">Mario</button>
        <span id="visible-count" class="muted"></span>
        <span class="muted" style="margin-left:auto">双击行 → 地图跟随</span>
      </div>
      <main>
        <table id="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Class</th>
              <th>Tag</th>
              <th>状态</th>
              <th>类型状态</th>
              <th class="num">x</th>
              <th class="num">y</th>
              <th class="num">vx</th>
              <th class="num">vy</th>
              <th>组件</th>
              <th class="num" title="网络同步 ID（只有动态对象有）">NetID</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty hidden">没有匹配的对象</div>
      </main>
    </div>

    <!-- 客户端子页 -->
    <div id="sub-clients" class="sub-view hidden">
      <div class="filter-row">
        <span class="filter-label">筛选</span>
        <button class="filter-btn active" data-cfilter="all">全部</button>
        <button class="filter-btn" data-cfilter="connected">已连接</button>
        <button class="filter-btn" data-cfilter="disconnected">已断开</button>
        <button class="filter-btn" data-cfilter="unverified" title="未通过 token 验证">未验证</button>
        <button class="filter-btn" data-cfilter="stale" title="超过 2s 没收到包">卡死</button>
        <span id="clients-count" class="muted"></span>
      </div>
      <main>
        <table id="clients-table" class="hidden">
          <thead>
            <tr>
              <th>地址</th>
              <th>状态</th>
              <th class="num">playerId</th>
              <th>角色</th>
              <th class="num">上次收包</th>
              <th class="num">收包数</th>
              <th class="num">字节数</th>
            </tr>
          </thead>
          <tbody id="clients-tbody"></tbody>
        </table>
        <div id="clients-empty" class="empty">暂无客户端连接</div>
      </main>
    </div>
  </section>
</div>

<script src="/map.js"></script>
<script src="/app.js"></script>
</body>
</html>
