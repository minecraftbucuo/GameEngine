# GitHub Pages 自动部署 Web 版（WASM）
# 触发条件：push 到 main，或手动触发（Actions 页面 -> Run workflow）
# 首次使用前需在仓库 Settings -> Pages -> Source 选择 "GitHub Actions"（一次性设置）
name: Deploy Web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # 与本地 emsdk 版本保持一致，避免行为差异
          version: 6.0.8
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure (emcmake)
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --parallel $(nproc)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Emscripten 四件套（html/js/wasm/data）所在目录
          path: build-web/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
